sources:
  - name: aworks
    database: fea_academy
    schema: adventure_works
    tables:
    
      - name: sales_salesorderheader
        description: Table sales from AdventureWork's ERP
        columns:
          - name: salesorderid
            tests:
              - unique
              - not_null

      - name: sales_salesorderdetail
        description: Itens dos pedidos de venda.
        columns:
          - name: salesorderdetailid
            tests:
              - unique
              - not_null

          - name: salesorderid
            tests:
              - not_null

          - name: productid
            tests:
              - not_null

      - name: sales_customer
        description: Cadastro de clientes.
        columns:
          - name: customerid
            tests:
              - unique
              - not_null

      - name: sales_creditcard
        description: Cartões de crédito utilizados nas vendas.
        columns:
          - name: creditcardid
            tests:
              - unique
              - not_null

      - name: sales_salesreason
        description: Motivos de venda.
        columns:
          - name: salesreasonid
            tests:
              - unique
              - not_null

      - name: sales_salesorderheadersalesreason
        description: Relacionamento entre pedidos e motivos de venda.

        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - salesorderid
                - salesreasonid

        columns:
          - name: salesorderid
            tests:
              - not_null

          - name: salesreasonid
            tests:
              - not_null

      - name: sales_salesperson
        description: Cadastro de vendedores.
        columns:
          - name: businessentityid
            tests:
              - unique
              - not_null

      # -------------------------------------------------

      - name: production_product
        description: Produtos.
        columns:
          - name: productid
            tests:
              - unique
              - not_null

      - name: production_productsubcategory
        description: Subcategorias de produtos.
        columns:
          - name: productsubcategoryid
            tests:
              - unique
              - not_null

      - name: production_productcategory
        description: Categorias de produtos.
        columns:
          - name: productcategoryid
            tests:
              - unique
              - not_null

      # ------------------------------------------------

      - name: person_person
        description: Pessoas físicas.
        columns:
          - name: businessentityid
            tests:
              - unique
              - not_null

      - name: person_address
        description: Endereços.
        columns:
          - name: addressid
            tests:
              - unique
              - not_null

      - name: person_stateprovince
        description: Estados e províncias.
        columns:
          - name: stateprovinceid
            tests:
              - unique
              - not_null

      - name: person_countryregion
        description: Países.
        columns:
          - name: countryregioncode
            tests:
              - unique

      - name: person_businessentityaddress
        description: Relacionamento entre entidade e endereço.

        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - businessentityid
                - addressid
                - addresstypeid

      # ----------------------------------------------------------

      - name: humanresources_employee
        description: Funcionários.
        columns:
          - name: businessentityid
            tests:
              - unique
              - not_null